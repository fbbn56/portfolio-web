      const [activeSection, setActiveSection] = useState('home');
      const [darkMode, setDarkMode] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [showResumeModal, setShowResumeModal] = useState(false);
      const [activeProjectFilter, setActiveProjectFilter] = useState('all');
      const [activeCodeTab, setActiveCodeTab] = useState('python');

      // Typewriter states
      const roles = [
        "Web Developer",
        "Python Programmer",
        "C Enthusiast",
        "SIH 2026 Participant",
        "CS Student @ JECRC"
      ];
      const [currentRoleIndex, setCurrentRoleIndex] = useState(0);
      const [displayText, setDisplayText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);

      // Typing animation effect
      useEffect(() => {
        const fullText = roles[currentRoleIndex];
        const typingSpeed = isDeleting ? 40 : 90;
        
        const timer = setTimeout(() => {
          if (!isDeleting) {
            setDisplayText(fullText.substring(0, displayText.length + 1));
            if (displayText === fullText) {
              setTimeout(() => setIsDeleting(true), 1800);
            }
          } else {
            setDisplayText(fullText.substring(0, displayText.length - 1));
            if (displayText === '') {
              setIsDeleting(false);
              setCurrentRoleIndex((prev) => (prev + 1) % roles.length);
            }
          }
        }, typingSpeed);

        return () => clearTimeout(timer);
      }, [displayText, isDeleting, currentRoleIndex]);

      // Initialize theme preference
      useEffect(() => {
        const isDark = localStorage.getItem('theme') === 'dark' || 
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        setDarkMode(isDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, []);

      const toggleTheme = () => {
        const nextMode = !darkMode;
        setDarkMode(nextMode);
        if (nextMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      };

      // Show toast
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // Copy email action
      const handleCopyEmail = () => {
        navigator.clipboard.writeText('bharat.jecrc@gmail.com');
        triggerToast('Email copied to clipboard: bharat.jecrc@gmail.com');
      };

      // Smooth scroll to section
      const scrollTo = (id) => {
        setActiveSection(id);
        const el = document.getElementById(id);
        if (el) {
          const yOffset = -90;
          const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      };

      // Listen to scroll to update active section
      useEffect(() => {
        const handleScroll = () => {
          const sections = ['home', 'about', 'projects', 'hackathons', 'services', 'contact'];
          const scrollPosition = window.scrollY + 120;
          for (const section of sections) {
            const el = document.getElementById(section);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(section);
                break;
              }
            }
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const projects = [
